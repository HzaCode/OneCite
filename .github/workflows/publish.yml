# PyPI publish workflow — manual trigger only.
# Publishing is intentionally not automated; run this workflow by hand
# from the Actions tab when a release should go to PyPI.

name: Publish to PyPI

on:
  workflow_dispatch:

jobs:
  build-only:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check distribution metadata
      run: twine check dist/*

    # Publishing step intentionally omitted; upload manually with twine
    # after verifying the built artifacts.
